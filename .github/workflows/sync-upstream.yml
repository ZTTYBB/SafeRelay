name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sync'
        required: true
        default: 'main'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/qianqi32/SafeRelay.git
          git remote -v

      - name: Fetch upstream
        run: |
          git fetch upstream
          echo 'Upstream latest commits:'
          git log upstream/main --oneline -3

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo 0)
          echo "Behind upstream: $BEHIND commits"
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout ${{ github.event.inputs.branch || 'main' }}
          git merge upstream/main --no-edit
          echo 'Merge completed'

      - name: Push changes
        if: steps.check.outputs.behind != '0'
        run: |
          git push origin ${{ github.event.inputs.branch || 'main' }}
          echo 'Pushed to origin'

      - name: No update needed
        if: steps.check.outputs.behind == '0'
        run: echo 'Already up to date'
