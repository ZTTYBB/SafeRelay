name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fix KV ID after upstream sync
        run: |
          if grep -q 'id = ""' wrangler.toml; then
            sed -i 's/id = ""/id = "8c06127f592d49d9aea3722486f30c9d"/' wrangler.toml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wrangler.toml
            git commit -m "chore: restore KV ID after upstream sync [skip ci]"
            git push
          fi

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set secrets
        run: |
          echo "${{ secrets.ENV_BOT_TOKEN }}" | npx wrangler secret put ENV_BOT_TOKEN
          echo "${{ secrets.ENV_BOT_SECRET }}" | npx wrangler secret put ENV_BOT_SECRET
          echo "${{ secrets.ENV_ADMIN_UID }}" | npx wrangler secret put ENV_ADMIN_UID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Activate Webhook
        run: |
          curl -s https://saferelay.cyx041024.workers.dev/registerWebhook
